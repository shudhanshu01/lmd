<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriMatrix | Register New User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/government-theme.css">
</head>
<body class="bg-light">
  <div class="top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="badge bg-warning text-dark">VeriMatrix Registration</span>
      <a href="login.html" class="text-white text-decoration-none"><i class="bi bi-box-arrow-in-right me-1"></i> Existing user? Login</a>
    </div>
  </div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-gov shadow-sm">
          <div class="card-header text-center py-3">
            <h4 class="m-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i> Register as a New User</h4>
            <p class="text-muted small mb-0 mt-2">Choose the role that matches your organisation or department.</p>
          </div>
          <div class="card-body p-4">
            <form id="registrationForm" onsubmit="handleRegistration(event)">
              <div class="mb-4">
                <label for="registrationRole" class="form-label fw-semibold">Registration Type</label>
                <select id="registrationRole" class="form-select" onchange="updateRegistrationFields()" required>
                  <option value="business">Shopkeeper / Business Owner</option>
                  <option value="manufacturer">Manufacturer, Dealer or Repairer</option>
                  <option value="government">Government Department Employee</option>
                  <option value="lmo">Legal Metrology Officer (LMO)</option>
                  <option value="gatc">GATC Testing Center</option>
                </select>
              </div>

              <div id="commonFields" class="row g-3">
                <div class="col-md-6">
                  <label for="fullName" class="form-label fw-semibold">Full Name</label>
                  <input id="fullName" name="fullName" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label fw-semibold">Official Email</label>
                  <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold">Mobile Number</label>
                  <input type="tel" id="phone" name="phone" class="form-control" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="col-md-6">
                  <label for="organisation" class="form-label fw-semibold" id="organisationLabel">Business / Organisation Name</label>
                  <input id="organisation" name="organisation" class="form-control" required>
                </div>
              </div>

              <div id="businessFields" class="row g-3 mt-1">
                <div class="col-md-6">
                  <label for="businessId" class="form-label fw-semibold">Trade License / GSTIN</label>
                  <input id="businessId" name="businessId" class="form-control" placeholder="Enter license or GSTIN">
                </div>
                <div class="col-md-6">
                  <label for="businessAddress" class="form-label fw-semibold">Business Address</label>
                  <input id="businessAddress" name="businessAddress" class="form-control">
                </div>
              </div>

              <div id="governmentFields" class="row g-3 mt-1 d-none">
                <div class="col-md-6">
                  <label for="employeeId" class="form-label fw-semibold">Employee ID</label>
                  <input id="employeeId" name="employeeId" class="form-control">
                </div>
                <div class="col-md-6">
                  <label for="department" class="form-label fw-semibold">Department / Office</label>
                  <input id="department" name="department" class="form-control">
                </div>
              </div>

              <div id="lmoFields" class="row g-3 mt-1 d-none">
                <div class="col-md-6">
                  <label for="officerId" class="form-label fw-semibold">Officer ID</label>
                  <input id="officerId" name="officerId" class="form-control" placeholder="Example: LMO-UK-1026">
                </div>
                <div class="col-md-6">
                  <label for="jurisdiction" class="form-label fw-semibold">Jurisdiction / Zone</label>
                  <input id="jurisdiction" name="jurisdiction" class="form-control">
                </div>
              </div>

              <div id="gatcFields" class="row g-3 mt-1 d-none">
                <div class="col-md-6">
                  <label for="centerId" class="form-label fw-semibold">Testing Center ID</label>
                  <input id="centerId" name="centerId" class="form-control" placeholder="Example: GATC-LAB-02">
                </div>
                <div class="col-md-6">
                  <label for="accreditation" class="form-label fw-semibold">Accreditation Number</label>
                  <input id="accreditation" name="accreditation" class="form-control">
                </div>
              </div>

              <div class="form-check mt-4 mb-3">
                <input class="form-check-input" type="checkbox" id="declaration" required>
                <label class="form-check-label small" for="declaration">I confirm that the information provided is accurate and can be verified by the department.</label>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold py-2"><i class="bi bi-send me-1"></i> Submit Registration Request</button>
            </form>
            <div id="registrationMessage" class="alert alert-success mt-4 d-none" role="status"></div>
          </div>
          <div class="card-footer bg-light text-center py-3">
            <a href="index.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Public Homepage</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    const roleFieldGroups = ['businessFields', 'governmentFields', 'lmoFields', 'gatcFields'];
    const roleLabels = {
      business: 'Business / Organisation Name',
      manufacturer: 'Business / Organisation Name',
      government: 'Department / Office Name',
      lmo: 'Legal Metrology Office',
      gatc: 'Testing Center Name'
    };

    function updateRegistrationFields() {
      const role = document.getElementById('registrationRole').value;
      roleFieldGroups.forEach(groupId => document.getElementById(groupId).classList.add('d-none'));
      if (role === 'business' || role === 'manufacturer') document.getElementById('businessFields').classList.remove('d-none');
      if (role === 'government') document.getElementById('governmentFields').classList.remove('d-none');
      if (role === 'lmo') document.getElementById('lmoFields').classList.remove('d-none');
      if (role === 'gatc') document.getElementById('gatcFields').classList.remove('d-none');
      document.getElementById('organisationLabel').textContent = roleLabels[role];
    }

    async function handleRegistration(event) {
      event.preventDefault();
      const form = document.getElementById('registrationForm');
      const formData = Object.fromEntries(new FormData(form));
      const role = document.getElementById('registrationRole').value;
      const registrations = getStorage(STORAGE_KEYS.REGISTERED_USERS);
      registrations.push({
        id: `REG-${Date.now()}`,
        role,
        ...formData,
        status: role === 'business' || role === 'manufacturer' ? 'ACTIVE' : 'PENDING_APPROVAL',
        submittedAt: new Date().toISOString()
      });
      setStorage(STORAGE_KEYS.REGISTERED_USERS, registrations);
      try {
        await apiRequest('/users', { method: 'POST', body: JSON.stringify({
          name: formData.fullName,
          email: formData.email,
          phone: formData.phone,
          role: role === 'business' || role === 'manufacturer' ? 'SHOPKEEPER' : role.toUpperCase(),
          organisation: formData.organisation,
          status: role === 'business' || role === 'manufacturer' ? 'ACTIVE' : 'PENDING_APPROVAL'
        }) });
      } catch (error) {
        if (!error.message.includes('503')) console.warn(`Registration API unavailable: ${error.message}`);
      }
      form.classList.add('d-none');
      const message = document.getElementById('registrationMessage');
      message.textContent = role === 'business' || role === 'manufacturer'
        ? 'Registration submitted successfully. You can now continue to the System Portal Login.'
        : 'Registration request submitted for department verification. You will be able to access the portal after approval.';
      message.classList.remove('d-none');
    }
  </script>
</body>
</html>
