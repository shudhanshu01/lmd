<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriMatrix | Public Certificate Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/government-theme.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card card-gov p-4">
          <h4 class="fw-bold text-center mb-4"><i class="bi bi-shield-check text-success me-2"></i> Public Verification Portal</h4>
          <div class="input-group mb-4">
            <input type="text" id="certInput" class="form-control form-control-lg" placeholder="Enter Certificate No. (e.g. LM-CERT-2026-001248)">
            <button class="btn btn-primary px-4" onclick="verifyCert()">Verify Authenticity</button>
          </div>
          <div id="certDisplay"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/verification.js"></script>
</body>
</html>
